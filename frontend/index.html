<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 500px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
        }

        #text {
            background: #f2f2f2;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            margin: 20px 0;
        }

        textarea {
            width: 95%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            resize: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4c5fd5;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⌨️ Typing Speed Test</h1>

    <p>Type the following sentence:</p>

    <div id="text">
        DevOps helps developers automate software development and deployment.
    </div>

    <textarea id="input"
        placeholder="Start typing here..."
        oninput="startTest()"></textarea>

    <br>

    <button onclick="checkResult()">Check Result</button>

    <button onclick="restartTest()">Restart</button>

    <div class="result" id="result"></div>

</div>

<script>

let startTime = null;

function startTest() {

    if (startTime === null) {
        startTime = new Date();
    }
}

async function checkResult() {

    const input = document.getElementById("input").value;

    if (input.length === 0) {
        document.getElementById("result").innerText =
            "Please start typing!";
        return;
    }

    if (startTime === null) {
        return;
    }

    const endTime = new Date();

    const timeTaken = (endTime - startTime) / 1000;

    const words = input.trim().split(/\s+/).length;

    const wpm = Math.round((words / timeTaken) * 60);

    try {

        const response = await fetch("/api/result", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                words: words,
                time: timeTaken,
                wpm: wpm
            })
        });

        const data = await response.json();

        document.getElementById("result").innerHTML =
            "⏱️ Time: " + data.time + " seconds<br>" +
            "📝 Words: " + data.words + "<br>" +
            "🚀 Speed: " + data.wpm + " WPM";

    } catch (error) {

        document.getElementById("result").innerText =
            "Backend connection error!";
    }
}

function restartTest() {

    document.getElementById("input").value = "";

    document.getElementById("result").innerHTML = "";

    startTime = null;
}

</script>

</body>
</html>
